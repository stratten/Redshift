<!-- TVMaze Match Modal -->
<div id="tvMazeMatchModal" class="modal tvmaze-match-modal" style="display: none;">
    <div class="modal-content tvmaze-match-modal-content" role="dialog" aria-modal="true" aria-labelledby="tvMazeMatchTitle">
        <div class="modal-header">
            <h2 id="tvMazeMatchTitle">Choose TV Series</h2>
            <button class="close-button" id="closeTvMazeMatchModal" type="button" aria-label="Close TV series matching">&times;</button>
        </div>
        <div class="modal-body tvmaze-match-modal-body">
            <p id="tvMazeMatchDescription"></p>
            <div id="tvMazeMatchCandidates" class="tvmaze-match-candidates"></div>
            <button id="openTvMazeSource" class="btn btn-secondary btn-sm" type="button">Match results: TVMaze</button>
            <p id="tvMazeMatchError" class="tvmaze-match-error" style="display: none;"></p>
        </div>
    </div>
</div>
